name: Build my event management

on:
  push:
    branches: [main]

jobs:
  build-management-app:
    runs-on: ubuntu-latest

  steps:
    - uses: actions/cache@v5.1.0
    - name: Set up Node JS
    - uses: actions/setup-node@v7.1.0
      with:
        node-version: 22.x
    - name: Install Dependencies
      run: npm install
    - name: Build Node.js APP
      run: npm run build
        
    
    
    
    
